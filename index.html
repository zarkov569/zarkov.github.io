<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <title>Zarkov.exe Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05050a; --surface: #0c111d; --surface-2: #121a2b; --line: #1b2438;
      --accent: #00ffcc; --accent-2: #38bdf8; --text: #eef2f7; --muted: #7b8aa3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
      background-image:
        radial-gradient(600px 300px at 85% -60px, rgba(0,255,204,.10), transparent 70%),
        radial-gradient(500px 280px at 10% -40px, rgba(56,189,248,.08), transparent 70%);
      background-repeat: no-repeat;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Top bar */
    .top-bar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(5,5,10,.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .store-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #00ffcc, #0aa5d8);
      color: #04141a; font: 800 20px/1 "Vazirmatn", sans-serif; direction: ltr;
      box-shadow: 0 6px 22px rgba(0,255,204,.28);
    }
    .brand h1 { font-size: 22px; font-weight: 800; line-height: 1.1; direction: ltr; }
    .brand h1 span { color: var(--accent); }
    .brand small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }

    .tg-mini {
      display: inline-flex; align-items: center; gap: 7px; direction: ltr; unicode-bidi: isolate;
      font-size: 13px; font-weight: 600; color: var(--accent-2);
      background: var(--surface); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
      transition: border-color .2s, background .2s;
    }
    .tg-mini svg { width: 16px; height: 16px; fill: currentColor; }
    .tg-mini:hover { border-color: var(--accent-2); background: var(--surface-2); }

    .search-box { position: relative; margin-bottom: 12px; }
    .search-box svg { position: absolute; top: 50%; right: 14px; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
    .search-box input {
      width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 44px 12px 16px; color: #fff; font: 400 14px "Vazirmatn", sans-serif; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-box input::placeholder { color: #5a6882; }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,204,.12); }

    .categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface); border: 1px solid var(--line); color: #9aa8c0;
      padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: .2s;
    }
    .cat-btn:hover { border-color: #2c3a58; color: #fff; }
    .cat-btn.active { background: var(--accent); color: #04141a; border-color: var(--accent); box-shadow: 0 4px 16px rgba(0,255,204,.25); }

    /* App list */
    .apps-grid {
      max-width: 860px; margin: 22px auto 0; padding: 0 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px;
    }
    .app-row-card {
      background: linear-gradient(150deg, #10162a, #090d17); border: 1px solid var(--line); border-radius: 20px;
      padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; transition: transform .15s, border-color .2s, box-shadow .2s;
      animation: rise .5s both;
    }
    .app-row-card:nth-child(2) { animation-delay: .07s; }
    .app-row-card:nth-child(3) { animation-delay: .14s; }
    .app-row-card:hover { border-color: rgba(0,255,204,.35); box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(0,255,204,.08); }
    .app-row-card:active { transform: scale(.98); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .row-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .row-icon { width: 66px; height: 66px; border-radius: 16px; object-fit: cover; border: 1px solid #28334a; flex-shrink: 0; background: var(--surface-2); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
    .row-info { min-width: 0; }
    .row-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; direction: ltr; justify-content: flex-end; }
    .row-info p { font-size: 12px; color: var(--muted); direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge-new { background: rgba(0,255,204,.12); color: var(--accent); font-size: 10px; padding: 2px 7px; border-radius: 6px; font-weight: 800; border: 1px solid rgba(0,255,204,.3); }

    .btn-get-small {
      background: var(--surface-2); color: var(--accent); border: 1px solid rgba(0,255,204,.28);
      padding: 8px 22px; border-radius: 999px; font-weight: 800; font-size: 13px; flex-shrink: 0; transition: .2s;
    }
    .btn-get-small:hover { background: var(--accent); color: #04141a; }

    .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 36px 10px; font-size: 14px; }

    /* Request banner */
    .request-section { max-width: 860px; margin: 28px auto 20px; padding: 0 20px; }
    .request-card {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #0f1a33, #0a0f1c); border: 1px solid #1f2c48; border-radius: 22px;
      padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .request-card::before { content: ""; position: absolute; width: 220px; height: 220px; top: -110px; right: -60px; background: radial-gradient(circle, rgba(56,189,248,.18), transparent 70%); pointer-events: none; }
    .request-info { position: relative; }
    .request-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .request-info p { font-size: 12.5px; color: #93a3bd; line-height: 1.7; }
    .btn-request {
      position: relative; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      background: linear-gradient(135deg, #38bdf8, #0284c7); color: #031018; padding: 11px 22px; border-radius: 16px;
      font-weight: 800; font-size: 13px; box-shadow: 0 6px 18px rgba(56,189,248,.28); transition: .2s;
    }
    .btn-request svg { width: 16px; height: 16px; fill: currentColor; }
    .btn-request:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(56,189,248,.35); }

    .footer { text-align: center; color: #4b5870; font-size: 12px; padding: 10px 20px calc(36px + env(safe-area-inset-bottom)); direction: ltr; }
    .footer a { color: var(--accent-2); }

    /* Detail sheet */
    .detail-page {
      position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto;
      transform: translateY(100%); visibility: hidden;
      transition: transform .38s cubic-bezier(.22,1,.36,1), visibility 0s .38s;
    }
    .detail-page.active { transform: none; visibility: visible; transition: transform .38s cubic-bezier(.22,1,.36,1); }

    .detail-nav {
      position: sticky; top: 0; z-index: 20; background: rgba(5,5,10,.8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      padding: calc(12px + env(safe-area-inset-top)) 20px 12px; border-bottom: 1px solid var(--line);
    }
    .back-btn { background: var(--surface); border: 1px solid var(--line); color: var(--accent); font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; }
    .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .detail-hero { position: relative; overflow: hidden; }
    .detail-hero .glow { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(48px) saturate(1.4); opacity: .35; }
    .detail-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--bg)); }
    .detail-content { max-width: 620px; margin: 0 auto; padding: 0 20px calc(40px + env(safe-area-inset-bottom)); }
    .detail-header { position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; padding: 26px 20px 8px; max-width: 620px; margin: 0 auto; }
    .detail-icon { width: 100px; height: 100px; border-radius: 24px; object-fit: cover; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,.65); background: var(--surface-2); }
    .detail-title-box h2 { font-size: 22px; font-weight: 800; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; direction: ltr; }
    .detail-title-box .dev { font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 14px; direction: ltr; text-align: right; }
    .btn-get-large { display: inline-block; background: linear-gradient(135deg, #00ffcc, #00bfff); color: #04141a; padding: 10px 36px; border-radius: 999px; font-weight: 800; font-size: 14px; box-shadow: 0 6px 20px rgba(0,255,204,.3); transition: .2s; }
    .btn-get-large:hover { transform: translateY(-1px); }

    .specs-bar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin: 12px 0 24px; text-align: center; }
    .spec-item { padding: 14px 6px; font-size: 12px; color: var(--muted); }
    .spec-item + .spec-item { border-right: 1px solid var(--line); }
    .spec-item span { display: block; color: #f1f5f9; font-size: 14px; font-weight: 700; margin-top: 5px; direction: ltr; }

    .sec-label { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .video-box { width: 100%; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #000; margin-bottom: 24px; }
    .video-box video, .video-box img { width: 100%; max-height: 300px; display: block; object-fit: cover; }

    .hash-box { display: flex; align-items: center; gap: 12px; direction: ltr; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 20px; }
    .hash-box code { flex: 1; min-width: 0; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb3d1; word-break: break-all; }
    .copy-btn { flex-shrink: 0; background: var(--surface-2); color: var(--accent); border: 1px solid rgba(0,255,204,.28); padding: 7px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: .2s; }
    .copy-btn:hover { background: var(--accent); color: #04141a; }

    .video-fallback { display: block; text-align: center; font-size: 12.5px; color: var(--accent-2); margin: -14px 0 24px; }
    .video-fallback:hover { text-decoration: underline; }

    .desc-box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; font-size: 14px; color: #cbd5e1; line-height: 1.9; margin-bottom: 20px; }

    .tg-channel-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--surface); color: var(--accent-2); padding: 14px; border-radius: 16px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); transition: .2s; }
    .tg-channel-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .tg-channel-btn bdi { direction: ltr; }
    .tg-channel-btn:hover { background: var(--surface-2); border-color: var(--accent-2); }

    @media (max-width: 480px) {
      .request-card { flex-direction: column; align-items: stretch; text-align: right; }
      .btn-request { justify-content: center; }
      .brand small { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="wrap">
      <div class="store-title">
        <div class="brand">
          <div class="logo">Z</div>
          <div>
            <h1>Zarkov<span>.exe</span> Store</h1>
            <small>یاری و بەرنامەی تایبەت بۆ iOS / iPad</small>
          </div>
        </div>
        <a class="tg-mini" id="tgMini" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 3.4 2.9 10.6c-.9.4-.9 1.2-.2 1.4l4.8 1.5 1.8 5.6c.2.6.4.8.9.8s.6-.2.9-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.8-1.5-1.3ZM8.7 13.2l9.9-6.2c.5-.3.9-.1.5.2l-8.2 7.4-.3 3.4-1.9-4.8Z"/></svg>

        <input type="search" id="searchInput" placeholder="ل ناڤێ یارییەکێ بگەڕە..." oninput="filterApps()" aria-label="Search">
      </div>
      <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">هەمی (All)</button>
        <button class="cat-btn" onclick="filterCategory('game', this)">یاری (Games)</button>
        <button class="cat-btn" onclick="filterCategory('tweak', this)">بەرنامە/مۆد (Tweaks)</button>

  <section class="request-section">

      <a class="btn-request" id="requestBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 3.4 2.9 10.6c-.9.4-.9 1.2-.2 1.4l4.8 1.5 1.8 5.6c.2.6.4.8.9.8s.6-.2.9-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.8-1.5-1.3ZM8.7 13.2l9.9-6.2c.5-.3.9-.1.5.2l-8.2 7.4-.3 3.4-1.9-4.8Z"/></svg>
        داخواز بکە
      </a>
    </div>
  </section>

  <footer class="footer">© Zarkov.exe Store</footer>

  <div class="detail-page" id="detailPage" aria-hidden="true">
    <div class="detail-nav">
      <button class="back-btn" onclick="closeDetail()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" transform="scale(-1 1) translate(-24 0)"/></svg>
        زڤڕین (Store)
      </button>
    </div>
    <div id="detailRoot"></div>
  </div>

        description: "Spotify ڤێرشنا v8.8.6 بۆ ئایفۆن و ئایپاد. گوهدارییا میوزیک و پۆدکاستان بکە ل هەر دەمەکێ."
      },
      {

        posterUrl: "https://images.unsplash.com/photo-1585314062340-f1a5a7c9328d?w=400&auto=format&fit=crop&q=80",

      {

        icon: "https://github.com/zarkov569/zarkov.github.io/releases/download/photo/IMG_5802.jpeg",

    let currentCategory = 'all';
    const grid = document.getElementById('appsGrid');

    function renderApps(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<div class="empty">چ ئەپەک نەهاتە دیتن...</div>';
        return;
      }
      list.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-row-card';
        card.onclick = () => openDetail(app.id);
        card.innerHTML = `
          <div class="row-left">
            <img src="${app.icon}" alt="${app.name}" class="row-icon" loading="lazy">
            <div class="row-info">
              <h3>${app.isNew ? '<span class="badge-new">NEW</span>' : ''}<span>${app.name}</span></h3>
              <p>${app.subtitle}</p>
            </div>
          </div>
          <a href="${app.downloadUrl}" class="btn-get-small" onclick="event.stopPropagation()">GET</a>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterApps();
    }

    function filterApps() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      renderApps(appsData.filter(app => {
        const okCat = currentCategory === 'all' || app.category === currentCategory;
        const okSearch = app.name.toLowerCase().includes(q) || app.subtitle.toLowerCase().includes(q);
        return okCat && okSearch;
      }));
    }

    function openDetail(id) {
      const app = appsData.find(a => a.id === id);
      if (!app) return;

      const media = app.videoUrl ? `
        <div class="sec-label">${app.videoLabel || 'Gameplay Preview'}</div>
        <div class="video-box">
          <video controls playsinline webkit-playsinline preload="auto" poster="${app.posterUrl}">
            <source src="${app.videoUrl}" type="${app.videoType || (app.videoUrl.endsWith('.mov') ? 'video/quicktime' : 'video/mp4')}">
          </video>
        </div>
        <a href="${app.videoUrl}" target="_blank" rel="noopener" class="video-fallback">ئەگەر ڤیدیۆکە کار نەکرد، لێرە بیکەرەوە</a>` : `
        <div class="sec-label">App Preview</div>
        <div class="video-box"><img src="${app.posterUrl}" alt="Preview"></div>`;

      document.getElementById('detailRoot').innerHTML = `
        <div class="detail-hero">
          <div class="glow" style="background-image:url('${app.icon}')"></div>
          <div class="detail-header">
            <img src="${app.icon}" alt="${app.name}" class="detail-icon">
            <div class="detail-title-box">
              <h2>${app.isNew ? '<span class="badge-new">NEW</span>' : ''}<span>${app.name}</span></h2>
              <div class="dev">${app.dev}</div>
              <a href="${app.downloadUrl}" class="btn-get-large">GET</a>
            </div>
          </div>
        </div>
        <div class="detail-content">
          <div class="specs-bar">
            <div class="spec-item">Size <span>${app.size}</span></div>
            <div class="spec-item">Version <span>${app.version}</span></div>
            <div class="spec-item">Platform <span>${app.platform}</span></div>
          </div>
          ${media}
          <div class="sec-label">What's New</div>
          <div class="desc-box">${app.description}</div>
          ${app.sha256 ? `
          <div class="sec-label">SHA-256</div>
          <div class="hash-box">
            <code>${app.sha256}</code>
            <button class="copy-btn" onclick="copyHash(this, '${app.sha256}')">کۆپی</button>
          </div>` : ''}
          <a href="${TG_URL}" target="_blank" rel="noopener" class="tg-channel-btn">
            ${TG_ICON}
            <span>کەناڵێ مە یێ تێلیگرامی: <bdi>@${TG_USER}</bdi></span>
          </a>
        </div>
      `;

      const page = document.getElementById('detailPage');
      page.scrollTop = 0;
      page.classList.add('active');
      page.setAttribute('aria-hidden', 'false');
    }

    function closeDetail() {
      const vid = document.querySelector('#detailRoot video');
      if (vid) vid.pause();
      const page = document.getElementById('detailPage');
      page.classList.remove('active');
      page.setAttribute('aria-hidden', 'true');
    }

    function copyHash(btn, text) {
      const done = () => { const old = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = old, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }
    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

    renderApps(appsData);
  </script>
</body>
